
# TiCDC Server 监听的地址，默认：127.0.0.1:8300
# the listening address of TiCDC server, default: 127.0.0.1:8300
addr = "127.0.0.1:8300"

# 用于客户端建立连接的对外公开的地址，这个地址会被注册到 PD, 默认：和 addr 相同
# the advertised listening address for client communication, this address will be registered with the PD, default: same with the addr item
advertise-addr = "127.0.0.1:8300"

# 日志文件路径
# log file path
log-file = "/tmp/ticdc/ticdc.log"

# 日志级别 (debug|info|warn|error) 默认："info"
# log level (debug|info|warn|error) default: "info"
log-level = "info"

# CDC GC safepoint TTL，以秒为单位，默认：86400(24H)
# CDC GC safepoint TTL duration, specified in seconds, default: 86400(24H)
# gc-ttl = 86400

# TiCDC 集群的时区，默认： "System"
# the time zone of TiCDC cluster, default: "System"
# tz = "System"

[log.file]
# Max log file size in MB (upper limit to 4096MB).
max-size = 300

# Max log file keep days. No clean up by default.
max-days = 0

# Maximum number of old log files to retain. No clean up by default.
max-backups = 0

[security]
# ca-path = ""
# cert-path = ""
# key-path = ""
# cert-allowed-cn = ["cn1","cn2"]
## Use mtls or just tls when proper cert/ca/key are provided.
# mtls = false

# Enable TiDB username/password authentication for every non-public HTTP API.
# Only health and basic status probes remain public. Metrics, diagnostics, and
# management clients must supply credentials when this option is enabled.
# Use TLS to protect credentials in transit.
# client-user-required = true
# client-allowed-user = ["cdc-reader", "cdc-operator", "cdc-admin"]

# Explicit role bindings enable deny-by-default authorization. Without this
# section, allowed users retain the legacy cluster-administrator permissions.
# Authorization requires client-user-required = true. Every bound user must
# also appear in client-allowed-user; unbound users have no API permissions.
# Upgrade and configure ALL captures before relying on resource isolation.
#
# viewer: read scoped changefeed status and processors, with filtered collection
# results. Detail responses omit replica configuration and redact URI secrets.
# operator: viewer permissions plus create/update/pause/resume/delete and table
# scheduling within the bound scope, and the TSO/table-verification helpers used
# by CLI create/resume. Creation without an ID requires changefeed
# = "*", since the server generates an ID after authorization.
# admin: all registered APIs, including unsafe GC/lock operations, raw metadata,
# config, metrics, profiling, and the legacy /capture/owner/* management API.
# The legacy admin endpoint accepts only stop (1), resume (2), and remove (3).
# The v2 meta_info endpoint also redacts sink URI credentials, including for
# administrators and deployments without client-user-required enabled.
# Legacy operation logs include the verified actor, target, job type and result;
# a username supplied without successful authentication is not a verified actor.
#
# Namespace and changefeed match exact identifiers or the complete string "*".
# Scoped roles require both fields; admin bindings must omit both scope fields.
# v1 changefeed operations always use namespace "default", even if a namespace
# query parameter is supplied. Use v2 for other namespaces.
# These are CDC permissions; TiDB SQL grants are not used for authorization.
#
# [[security.client-authorization.bindings]]
# user = "cdc-reader"
# role = "viewer"
# namespace = "team-a"
# changefeed = "orders"
#
# [[security.client-authorization.bindings]]
# user = "cdc-operator"
# role = "operator"
# namespace = "team-a"
# changefeed = "*"
#
# [[security.client-authorization.bindings]]
# user = "cdc-admin"
# role = "admin"
